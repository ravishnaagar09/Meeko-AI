{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<p class="greeting" data-greeting></p>
<h1>Welcome back</h1>
<p class="muted lead">Log in to continue studying.</p>

{% if errors.form %}
<div class="alert" role="alert">{{ errors.form }}</div>
{% endif %}

<form method="post" action="/login" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf }}">

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ values.email or '' }}" required autofocus
           autocomplete="email" maxlength="254" placeholder="you@college.edu">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="128">
      <button type="button" class="pw-toggle" data-toggle-pw="password" aria-pressed="false">Show</button>
    </div>
  </div>

  <button class="btn btn-block" type="submit">Log in</button>
</form>

<p class="switch-line">New to Meeko? <a href="/signup">Create an account</a></p>
{% endblock %}
