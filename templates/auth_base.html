<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meeko{% endblock %} · Meeko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/brand.css">
  <link rel="stylesheet" href="/static/meeko.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1525" media="(prefers-color-scheme: dark)">
  <script src="/static/theme.js"></script>
</head>
<body class="auth-body">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
    <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <main class="auth-wrap">
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="brand-logo" src="/static/logo.png" alt="" width="48" height="48">
          <div>
            <div class="brand-name">Mee<span>ko</span></div>
            <div class="brand-sub">Your AI study buddy</div>
          </div>
        </div>
        {% for f in flash %}
        <div class="alert {{ 'ok' if f.kind == 'ok' else '' }}" role="alert">{{ f.message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
      </div>
    </section>
  </main>

  <script>
    // "Show / Hide" button for password boxes
    document.querySelectorAll("[data-toggle-pw]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.getAttribute("data-toggle-pw"));
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Hide" : "Show";
        btn.setAttribute("aria-pressed", show);
      });
    });
  </script>
</body>
</html>
