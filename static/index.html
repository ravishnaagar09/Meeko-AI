<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeko · Your AI study buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/brand.css">
  <link rel="stylesheet" href="/static/meeko.css">
  <link rel="stylesheet" href="/static/jobs.css?v=2">  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#0a1f3a">
  <script src="/static/theme.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img class="brand-logo" src="/static/logo.png" alt="" width="40" height="40">
        <div>
          <div class="brand-name">Mee<span>ko</span></div>
          <div class="brand-sub">Your AI study buddy</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <label class="doc-picker">
          <span class="doc-picker-label">Studying</span>
          <select id="docSelect" aria-label="Select a document to study"></select>
        </label>
        <div class="status" id="status" role="status"></div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
          <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="topbar-user" id="topUser" href="/profile" aria-label="My profile" style="margin-left:12px"></a>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/static/jobs.js?v=2"></script>  <script src="/static/meeko.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
